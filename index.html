<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPulse |simple Student Management System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Main Dashboard Shell -->
    <div class="dashboard-container">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>Edu<span>Pulse</span></h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" class="active"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="#"><span class="icon">👨‍🎓</span> Students</a></li>
                <li><a href="#"><span class="icon">📚</span> Courses</a></li>
                <li><a href="#"><span class="icon">📝</span> Attendance</a></li>
                <li><a href="#"><span class="icon">⚙️</span> Settings</a></li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Top Utility Navbar -->
            <header class="top-nav">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="global-search" placeholder="Search students by name, ID, or major...">
                </div>
                <div class="admin-profile">
                    <div class="avatar">AM</div>
                    <span>Admin Portal</span>
                </div>
            </header>

            <!-- Metrics Statistics Dashboard -->
            <section class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-info">
                        <h3>Total Students</h3>
                        <p id="total-students-count">0</p>
                    </div>
                    <div class="metric-icon blue">🎓</div>
                </div>
                <div class="metric-card">
                    <div class="metric-info">
                        <h3>Active Courses</h3>
                        <p>12</p>
                    </div>
                    <div class="metric-icon green">📖</div>
                </div>
                <div class="metric-card">
                    <div class="metric-info">
                        <h3>Avg Attendance</h3>
                        <p>94.2%</p>
                    </div>
                    <div class="metric-icon purple">📈</div>
                </div>
            </section>

            <!-- Dynamic Workspace Layout Grid -->
            <div class="workspace-grid">
                
                <!-- Student Register Form Module -->
                <div class="content-card form-card">
                    <h3>Register New Student</h3>
                    <form id="student-form" class="student-form">
                        <div class="form-group">
                            <label for="student-name">Full Name *</label>
                            <input type="text" id="student-name" required placeholder="Jane Doe">
                        </div>
                        <div class="form-group">
                            <label for="student-email">Email Address *</label>
                            <input type="email" id="student-email" required placeholder="jane.doe@university.edu">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="student-major">Major/Course *</label>
                                <select id="student-major" required>
                                    <option value="" disabled selected>Select Major</option>
                                    <option value="Computer Science">Computer Science</option>
                                    <option value="Data Science">Data Science</option>
                                    <option value="Business Administration">Business Administration</option>
                                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="student-gpa">Current GPA *</label>
                                <input type="number" id="student-gpa" step="0.01" min="0" max="4.0" required placeholder="3.85">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Add Student Record</button>
                    </form>
                </div>

                <!-- Database Live Directory View Table -->
                <div class="content-card table-card">
                    <div class="card-header">
                        <h3>Student Directory</h3>
                        <span class="badge" id="directory-badge">Showing All Records</span>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Student ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Major</th>
                                    <th>GPA</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="student-table-body">
                                <!-- Dynamic dynamic markup row injections will render here -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

        </main>
    </div>

</body>
</html>
